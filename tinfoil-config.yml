# Ellida agent enclave: the public config for Tinfoil Containers.
#
# This file lives in the PUBLIC config repo (Tinfoil reads it at deploy time
# to compute the enclave measurement; the phone's SDK reads it from the
# Sigstore transparency log on every connection). Nothing secret belongs here.
# The image is pinned by digest: that digest is what users verify.
#
# cvm-version: from tinfoilsh/tinfoil-containers-template on 2026-10-20.
cvm-version: 0.14.7
cpus: 2
memory: 8192

containers:
  - name: agent
    # Replace with the digest printed by the image workflow for the release.
    image: "ghcr.io/ellida-prd/ellida-agent-enclave@sha256:7294c46f8e175e06b83a734baa4a50219f46749db0561770fc4ff0ee8b85b682"
    env:
      - PORT: "8080"
      - TURN_BUDGET_SECONDS: "300"
      - STOP_TIMEOUT_SECONDS: "330"
      # Public values: the Stage project and its publishable key. Prod gets
      # its own instance with its own config.
      - SUPABASE_URL: "https://qhtxcpoudnsheozvojob.supabase.co"
      - SUPABASE_ANON_KEY: "sb_publishable_VZoVwK0BACqlPXvQb0i3WA_poY_jW3D"
      - AI_PROXY_URL: "https://qhtxcpoudnsheozvojob.supabase.co/functions/v1/ai-proxy"
      - TOOL_PROXY_URL: "https://qhtxcpoudnsheozvojob.supabase.co/functions/v1/tool-proxy"
      - NOTIFY_URL: "https://qhtxcpoudnsheozvojob.supabase.co/functions/v1/notify-agent-reply"
    # No secrets, by design (CISO, 2026-10-19): the container acts with the
    # user's own token and the publishable key only.
    networks: [backend]
    ports:
      - "8080:8080"

networks:
  backend:
    egress: allowlist
    allow:
      - qhtxcpoudnsheozvojob.supabase.co   # ai-proxy, tool-proxy, notify, PostgREST
      - atc.tinfoil.sh                     # attestation bundles for the model enclave
      - api.open-meteo.com                 # get_weather
      - geocoding-api.open-meteo.com       # get_weather place lookup
      # The spike of 2026-10-20 adds the hostnames the tinfoil SDK contacts
      # for the model enclave and the transparency log (no wildcards allowed).

shim:
  upstream-port: 8080
  paths:
    - /runs
    - /health
